<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Trails</title>
</head>
<body>

<h1>Search Trails</h1>

<form method="get">
    <label for="search">Trail Name:</label>
    <input
        type="text"
        id="search"
        name="q"
        value="{{ query }}"
    >
    <button type="submit">Search</button>
</form>

{% if query %}
    <h2>Search Results</h2>

    {% if results %}
        <ul>
            {% for trail in results %}
                <li>{{ trail }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No trails found.</p>
    {% endif %}
{% endif %}

</body>
</html>

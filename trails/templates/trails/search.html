{% extends "base.html" %}

{% block title %}
Search Trails
{% endblock %}

{% block content %}

<h1>Search Trails</h1>

<form method="get">
    <label for="q">Trail Name:</label>
    <input type="text" id="q" name="q" value="{{ query }}">
    <button type="submit">Search</button>
</form>

{% if results %}
    <h2>Search Results</h2>

    <ul>
        {% for trail in results %}
            <li>{{ trail }}</li>
        {% endfor %}
    </ul>
{% endif %}

{% endblock %}
